name: MyHomes
version: 1.0.0
main: com.example.myhomes.MyHomesPlugin
api-version: '1.21'
author: MyHomes
website: https://example.com
softdepend:
  - LuckPerms
commands:
  homes:
    description: Open your homes dialog
    usage: /homes
    aliases: [home]
    permission: myhomes.use
permissions:
  myhomes.use:
    description: Allows use of /homes
    default: true
