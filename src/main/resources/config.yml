# Fallback max homes for a player with no LuckPerms meta set
default-max-homes: 1

# Absolute ceiling regardless of rank/meta (matches the "99" you mentioned)
absolute-max-homes: 99

# LuckPerms meta key read from each rank/group, e.g. group "vip" -> meta "homes-limit: 5"
luckperms-meta-key: "homes-limit"

gui:
  columns: 4        # how many buttons per row in the Dialog grid
  per-page: 20      # home buttons per Dialog page before "Show More" is needed
